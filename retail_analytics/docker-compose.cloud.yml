services:
  saas-db:
    image: ankane/pgvector:latest
    container_name: aivo-saas-db
    restart: always
    environment:
      POSTGRES_USER: aivo
      POSTGRES_PASSWORD: ${AIVO_POSTGRES_PASSWORD:?Set AIVO_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aivo_saas
    volumes:
    - aivo_saas_data:/var/lib/postgresql/data
  cloud-api:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    container_name: aivo-cloud-api
    restart: always
    command: uvicorn cloud_api:app --host 0.0.0.0 --port 8000
    environment:
    - DATABASE_URL=${AIVO_DATABASE_URL:?Set AIVO_DATABASE_URL in .env}
    - CAMERA_ENCRYPTION_KEY_FILE=/run/secrets/camera_key
    - LIVE_PREVIEW_DIR=/run/aivo-live
    depends_on:
    - saas-db
    networks:
    - default
    - proxy
    secrets:
    - camera_key
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json',
        timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
    - aivo_live_preview:/run/aivo-live
  cloud-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    container_name: aivo-cloud-dashboard
    restart: always
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
    - DATABASE_URL=${AIVO_DATABASE_URL:?Set AIVO_DATABASE_URL in .env}
    - CAMERA_ENCRYPTION_KEY_FILE=/run/secrets/camera_key
    - LIVE_PREVIEW_DIR=/run/aivo-live
    depends_on:
    - saas-db
    networks:
    - default
    - proxy
    secrets:
    - camera_key
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',
        timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
    - aivo_live_preview:/run/aivo-live:ro
  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    container_name: aivo-db-seed
    command: python seed_tenant.py
    environment:
    - DATABASE_URL=${AIVO_DATABASE_URL:?Set AIVO_DATABASE_URL in .env}
    depends_on:
    - cloud-api
    profiles:
    - maintenance
  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.browser
    container_name: aivo-browser-worker
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    environment:
    - DATABASE_URL=${AIVO_DATABASE_URL:?Set AIVO_DATABASE_URL in .env}
    - LIVE_PREVIEW_DIR=/run/aivo-live
    - BROWSER_ORIGIN=https://frigate.agenticx.ia.br
    networks:
    - default
    - proxy
    volumes:
    - aivo_live_preview:/run/aivo-live
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  aivo_saas_data: null
  aivo_live_preview:
    external: true
    name: aivo_live_preview
networks:
  proxy:
    external: true
    name: supreme_backend
secrets:
  camera_key:
    file: ./.secrets/camera.key
