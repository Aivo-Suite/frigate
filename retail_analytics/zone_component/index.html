<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<style>
body{font:14px system-ui;color:#172338;margin:0}canvas{width:100%;border-radius:12px;cursor:crosshair;background:#e9eef6;touch-action:manipulation}button{padding:10px 16px;border:1px solid #cbd5e1;background:white;border-radius:8px;margin:8px 8px 0 0}#apply{background:#175cd3;color:white;border-color:#175cd3}p{color:#526176}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-size:12px}
</style>
<div class="legend"><span style="color:#d97706">● Lado de fora</span><span style="color:#175cd3">● Lado de dentro</span><span style="color:#087f5b">● Setores</span></div>
<canvas id="view" width="960" height="540" aria-label="Desenhar zona na imagem"></canvas>
<div><button id="undo">Desfazer ponto</button><button id="clear">Limpar desenho</button><button id="apply">Usar este desenho</button></div>
<p id="hint" aria-live="polite">Clique nos cantos da área. Use pelo menos três pontos.</p>
<script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),bg=new Image();
let config=null,points=[];
const colors={outside:'#d97706',inside:'#175cd3',area:'#087f5b'};
function tell(type,data={}){parent.postMessage({isStreamlitMessage:true,type,...data},location.origin)}
function polygon(vertices,role,name,editing=false){
  if(!vertices.length)return;
  const color=colors[role]||colors.area;
  ctx.beginPath();vertices.forEach(([x,y],i)=>i?ctx.lineTo(x*canvas.width,y*canvas.height):ctx.moveTo(x*canvas.width,y*canvas.height));ctx.closePath();
  ctx.fillStyle=color+(editing?'44':'26');ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=editing?4:2;ctx.stroke();
  if(name){const [x,y]=vertices[0];ctx.font='18px system-ui';const width=ctx.measureText(name).width+16;ctx.fillStyle=color;ctx.fillRect(x*canvas.width,Math.max(0,y*canvas.height-26),width,26);ctx.fillStyle='white';ctx.fillText(name,x*canvas.width+8,Math.max(20,y*canvas.height-6))}
  if(editing)vertices.forEach(([x,y],i)=>{ctx.beginPath();ctx.arc(x*canvas.width,y*canvas.height,6,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.font='18px system-ui';ctx.fillStyle='white';ctx.fillText(String(i+1),x*canvas.width+10,y*canvas.height-10)});
}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,canvas.width,canvas.height);(config?.zones||[]).forEach(z=>polygon(z.points,z.role,z.name));polygon(points,config?.role,'',true)}
canvas.onclick=e=>{if(!config||points.length>=20)return;const r=canvas.getBoundingClientRect();points.push([Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]);document.getElementById('hint').textContent=`${points.length} pontos. Clique em Usar este desenho e depois em Salvar área.`;draw()};
document.getElementById('undo').onclick=()=>{points.pop();draw()};
document.getElementById('clear').onclick=()=>{points=[];draw()};
document.getElementById('apply').onclick=()=>{if(points.length<3){document.getElementById('hint').textContent='Marque pelo menos três pontos.';return}tell('streamlit:setComponentValue',{value:{editor_key:config.editor_key,points},dataType:'json'});document.getElementById('hint').textContent='Desenho aplicado. Clique em Salvar área no painel para concluir.'};
function resize(){tell('streamlit:setFrameHeight',{height:canvas.clientHeight+150})}
window.addEventListener('resize',resize);
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='streamlit:render')return;const next=e.data.args;if(!config||config.editor_key!==next.editor_key)points=next.points||[];config=next;bg.onload=()=>{canvas.height=Math.round(960*bg.naturalHeight/bg.naturalWidth);draw();resize()};if(bg.src!==next.image)bg.src=next.image;draw();resize()});
tell('streamlit:componentReady',{apiVersion:1});tell('streamlit:setFrameHeight',{height:620});
</script>
</html>
