<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>body{font:14px system-ui;color:#172338;margin:0}canvas{max-width:100%;border-radius:12px;cursor:crosshair;background:#e9eef6}button{padding:9px 16px;border:1px solid #cbd5e1;background:white;border-radius:8px;margin:8px 8px 0 0}p{color:#526176}</style><canvas id="view" width="640" height="360" aria-label="Desenhar zona na imagem"></canvas><div><button id="undo">Desfazer ponto</button><button id="clear">Limpar desenho</button><button id="apply">Usar este desenho</button></div><p id="hint">Clique nos cantos da área. Use pelo menos três pontos.</p><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),bg=new Image();let config=null,points=[];
function tell(type,data={}){parent.postMessage({isStreamlitMessage:true,type,...data},location.origin)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,canvas.width,canvas.height);if(!points.length)return;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x*canvas.width,y*canvas.height):ctx.moveTo(x*canvas.width,y*canvas.height));ctx.closePath();ctx.fillStyle='#175cd344';ctx.fill();ctx.strokeStyle='#175cd3';ctx.lineWidth=3;ctx.stroke();points.forEach(([x,y],i)=>{ctx.beginPath();ctx.arc(x*canvas.width,y*canvas.height,5,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.fillStyle='#172338';ctx.fillText(String(i+1),x*canvas.width+8,y*canvas.height-8)})}
canvas.onclick=e=>{if(!config||points.length>=20)return;const r=canvas.getBoundingClientRect();points.push([Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]);draw()};
document.getElementById('undo').onclick=()=>{points.pop();draw()};document.getElementById('clear').onclick=()=>{points=[];draw()};document.getElementById('apply').onclick=()=>{if(points.length<3){document.getElementById('hint').textContent='Marque pelo menos três pontos.';return}tell('streamlit:setComponentValue',{value:{editor_key:config.editor_key,points},dataType:'json'})};
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='streamlit:render')return;const next=e.data.args;if(!config||config.editor_key!==next.editor_key)points=next.points||[];config=next;bg.onload=()=>{canvas.height=Math.round(640*bg.naturalHeight/bg.naturalWidth);draw();tell('streamlit:setFrameHeight',{height:canvas.clientHeight+110})};bg.src=next.image;draw()});tell('streamlit:componentReady',{apiVersion:1});tell('streamlit:setFrameHeight',{height:470});
</script></html>
