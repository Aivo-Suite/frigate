<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>body{font:14px system-ui;color:#172338;margin:0}video{width:100%;max-height:440px;background:#101828;border-radius:12px}button{padding:10px 16px;margin:8px;border-radius:8px;border:1px solid #ccd;background:white}#status{padding:8px}</style><video id="video" muted playsinline controls></video><div><button id="start">Reproduzir ao vivo</button><button id="stop">Parar vídeo</button></div><div id="status">A reprodução será encerrada após cinco minutos.</div><script>
const video=document.getElementById('video'),status=document.getElementById('status');let cfg=null,ws=null,source=null,buffer=null,queue=[],initial=[],size=0,url=null,used=false;
function tell(type,data={}){parent.postMessage({isStreamlitMessage:true,type,...data},location.origin)}
function stop(message='Vídeo encerrado. Prepare uma nova sessão no painel.'){if(ws){const s=ws;ws=null;s.close()}video.pause();video.removeAttribute('src');video.load();if(url)URL.revokeObjectURL(url);url=null;source=buffer=null;queue=[];initial=[];size=0;status.textContent=message}
function flush(){if(!buffer||buffer.updating||!queue.length)return;try{if(video.currentTime>20&&buffer.buffered.length&&buffer.buffered.start(0)<video.currentTime-15){buffer.remove(0,video.currentTime-10);return}buffer.appendBuffer(queue.shift());if(video.buffered.length){const end=video.buffered.end(video.buffered.length-1);if(end-video.currentTime>5)video.currentTime=Math.max(0,end-1)}video.play().catch(()=>{})}catch{stop('Não foi possível reproduzir o vídeo. Tente novamente.')}}
function feed(bytes){if(buffer){queue.push(bytes);if(queue.length>32){stop('A conexão não acompanha o vídeo. Tente novamente.');return}flush();return}initial.push(bytes);size+=bytes.byteLength;if(size>1000000){stop('Formato de vídeo indisponível.');return}const all=new Uint8Array(size);let offset=0;initial.forEach(b=>{all.set(new Uint8Array(b),offset);offset+=b.byteLength});let at=-1;for(let i=0;i<all.length-8;i++){if(all[i]===97&&all[i+1]===118&&all[i+2]===99&&all[i+3]===67){at=i;break}}if(at<0||!source||source.readyState!=='open')return;const codec=[all[at+5],all[at+6],all[at+7]].map(x=>x.toString(16).padStart(2,'0')).join(''),mime=`video/mp4; codecs="avc1.${codec}"`;if(!MediaSource.isTypeSupported(mime)){stop('Este navegador não suporta o vídeo. Use Chrome ou Edge atualizado.');return}try{buffer=source.addSourceBuffer(mime);buffer.addEventListener('updateend',flush);queue=initial;initial=[];flush()}catch{stop('Não foi possível iniciar o vídeo.')}}
document.getElementById('start').onclick=()=>{if(!cfg||used)return;if(!window.MediaSource){stop('Use um navegador com suporte a MediaSource.');return}used=true;document.getElementById('start').disabled=true;status.textContent='Conectando à câmera da loja…';source=new MediaSource();url=URL.createObjectURL(source);video.src=url;source.addEventListener('sourceopen',()=>{if(initial.length)feed(new ArrayBuffer(0))});ws=new WebSocket(`wss://${location.host}/api/media/view`);const connection=ws;ws.binaryType='arraybuffer';ws.onopen=()=>connection.send(JSON.stringify({token:cfg.token}));ws.onmessage=e=>{if(ws!==connection)return;if(typeof e.data==='string')return;status.textContent='Ao vivo · sem áudio';feed(e.data)};ws.onerror=()=>stop('Câmera ou conexão indisponível. Verifique o Edge.');ws.onclose=()=>{if(ws===connection)stop()}};
document.getElementById('stop').onclick=()=>stop();window.addEventListener('pagehide',()=>stop());document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='streamlit:render')return;const next=e.data.args;if(!cfg||cfg.job_id!==next.job_id){stop();cfg=next;used=false;document.getElementById('start').disabled=false;status.textContent='Clique em Reproduzir ao vivo. A sessão dura até cinco minutos.'}});tell('streamlit:componentReady',{apiVersion:1});tell('streamlit:setFrameHeight',{height:540});
</script></html>
