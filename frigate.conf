server {
  listen 80;
  server_name frigate.agenticx.ia.br;

  location /.well-known/acme-challenge/ {
      alias /var/www/estacao/.well-known/acme-challenge/;
  }

  location / {
      return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name frigate.agenticx.ia.br;

  ssl_certificate /etc/nginx/certs/frigate_fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/frigate_privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # FastAPI
  location /api/ {
    proxy_pass http://2.25.163.64:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  location /docs {
    proxy_pass http://2.25.163.64:8000/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  
  location /openapi.json {
    proxy_pass http://2.25.163.64:8000/openapi.json;
    proxy_set_header Host $host;
  }

  # Streamlit Dashboard
  location / {
    proxy_pass http://2.25.163.64:8501;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }
}
